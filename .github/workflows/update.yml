name: MON IPTV - Daily catalogue update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: mon-iptv-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update TV candidates
        run: python scripts/update_tv_candidates.py

      - name: Update VOD candidates
        run: python scripts/update_vod_candidates.py

      - name: Enrich direct VOD media links
        run: python scripts/refresh_vod_media.py

      - name: Update EPG XMLTV
        run: python scripts/update_epg.py

      - name: Generate playlists
        run: python scripts/build.py

      - name: Publish updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/ public/
          git diff --cached --quiet || git commit -m "Daily MON IPTV catalogue and EPG refresh"
          git push
